[project]
name = "wordstat-trends"
version = "0.1.0"
description = "Витрина трендов поискового спроса Рунета на данных Яндекс Вордстат"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # d56e031 = PR #63: клик по кнопке CSV-меню — полные экспорты top_popular
    # и top_related (баг пустых рёбер #62). Рёбра графа обхода (#82) опираются
    # на этот фикс; на aacdd28 top_related всегда пуст.
    "wordstat @ git+https://github.com/axisrow/wordstat-cli.git@d56e031d0da6ce6918d45510da85f86c5a4bcd30",
    "sktime==1.1.0",
    "statsmodels==0.14.6",
    "statsforecast==2.0.1",
    "ruptures==1.1.10",
    "tsfresh==0.21.2",
    "tslearn==0.9.0",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    # Лемматизация — базовый этап NLP-конвейера (нужен и TF-IDF, и эмбеддингам),
    # а не тяжёлая ML-зависимость: ~5 МБ, чистый Python + DAWG-словарь. Живёт
    # в основных зависимостях, чтобы тесты шли в CI без extra `nlp` (torch ~2 ГБ).
    "pymorphy3==2.0.6",
]

[project.optional-dependencies]
# pymorphy3 перенесён в основные зависимости (см. комментарий выше): лишней
# тяжести в extra не осталось, `uv sync --extra nlp` ставит только модельные пакеты.
nlp = [
    "sentence-transformers==6.0.0",
    "torch==2.13.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Сетевые прогоны живых моделей — в CI не входят, запуск руками:
    # WORDSTAT_TRENDS_NLP_SMOKE=1 uv run pytest -m network (extra `nlp`).
    "network: тесты с выходом в сеть, в CI не запускаются",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordstat_trends"]

[tool.hatch.metadata]
# `wordstat` объявлен как прямая git-ссылка (project.dependencies) — hatchling
# по умолчанию такое запрещает (PEP 508 direct reference).
allow-direct-references = true

# `wordstat-cli` объявляет свою зависимость `browser-use` через
# `[tool.uv.sources]` как `{ path = "../browser-use", editable = true }` —
# путь относительно ЕГО СОБСТВЕННОГО репозитория. `tool.uv.sources` этого
# проекта переопределяет источники только для ПРЯМЫХ зависимостей
# wordstat-trends, а не для транзитивных зависимостей внутри `wordstat`
# (git-пакета) — поэтому объявить здесь `browser-use = { index = "pypi" }`
# не помогает, путь `../browser-use` всё равно резолвится при сборке
# `wordstat`. Единственный уровень, где `uv` (и `uv lock`, и `uv pip install`)
# слушает override для транзитивных зависимостей — `[tool.uv]
# override-dependencies`, отсюда и ниже. См. docs/STACK.md →
# «browser-use: обходной путь для установки».
[tool.uv]
override-dependencies = [
    "browser-use==0.13.8",
]
