<section>
  <h1>{{trends.title}}</h1>
  <div class="empty-state">
    <p class="empty-title">{{trends.empty.title}}</p>
    <p>{{trends.empty.text}}</p>
    <p class="empty-hint">{{trends.empty.hint}}</p>
  </div>
  <table class="trends-table">
    <caption class="visually-hidden">{{trends.title}}</caption>
    <thead>
      <tr>
        <th scope="col">{{trends.table.period}}</th>
        <th scope="col">{{trends.table.queries}}</th>
        <th scope="col">{{trends.table.share}}</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
